<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="بصيرة - منصة تحليل أداء الطلاب بالذكاء الاصطناعي من LearnaTech" />
  <title>بصيرة | LearnaTech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Pre-define config so app works even without config.js (which is gitignored) -->
  <script>window.BASEERA_CONFIG = {};</script>
  <!-- config.js holds the OpenAI key locally — gitignored, never committed -->
  <script src="config.js" onerror="console.info('config.js not found — AI quiz will use local question bank')"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js'"></script>
  <style>
    /* ─── DESIGN TOKENS ─────────────────────────────────────── */
    :root {
      --ink:       #16233D;
      --paper:     #EDEFEA;
      --card:      #F7F8F4;
      --growth:    #3E7859;
      --highlight: #E3A93E;
      --alert:     #B8503F;
      --text:      #293230;
      --border:    #D8DDD4;
      --shadow-sm: 0 1px 3px rgba(22,35,61,.07), 0 1px 2px rgba(22,35,61,.04);
      --shadow-md: 0 4px 12px rgba(22,35,61,.10), 0 2px 6px rgba(22,35,61,.06);
      --shadow-lg: 0 16px 40px rgba(22,35,61,.14), 0 4px 12px rgba(22,35,61,.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --transition: 200ms cubic-bezier(.4,0,.2,1);
    }

    /* ─── RESET & BASE ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: var(--paper);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Noto Kufi Arabic', sans-serif;
      color: var(--ink);
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; }
    img { max-width: 100%; }

    /* ─── SCROLLBAR ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ─── UTILITY ───────────────────────────────────────────── */
    .hidden { display: none !important; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

    /* ─── SKELETON SHIMMER ──────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #e8ece6 50%, var(--border) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }

    /* ─── BADGE ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 99px; font-size: .76rem; font-weight: 600;
    }
    .badge-success  { background: #d6ede3; color: #2a5c42; }
    .badge-warning  { background: #faefd2; color: #8a6118; }
    .badge-alert    { background: #f5dbd7; color: #8a3028; }
    .badge-neutral  { background: #e2e6e0; color: #4a5450; }
    .badge-coming   {
      background: linear-gradient(135deg, #faefd2, #fde9ac);
      color: #7a5012;
      border: 1px solid #f0cc76;
      font-weight: 700;
      font-family: 'Noto Kufi Arabic', sans-serif;
    }

    /* ─── CARD ──────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .card-hover {
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* ─── BUTTON ────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: .9rem; font-weight: 600; transition: all var(--transition);
    }
    .btn-primary {
      background: var(--growth); color: #fff;
      box-shadow: 0 2px 8px rgba(62,120,89,.35);
    }
    .btn-primary:hover { background: #33664a; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(62,120,89,.4); }
    .btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-alert { background: var(--alert); color: #fff; }
    .btn-alert:hover { background: #9c4133; }
    .btn-ghost { color: var(--ink); padding: 8px 14px; border-radius: var(--radius-sm); }
    .btn-ghost:hover { background: rgba(22,35,61,.07); }
    .btn-sm { padding: 6px 14px; font-size: .82rem; }
    .btn-lg { padding: 14px 28px; font-size: 1rem; }

    /* ─── INPUT ─────────────────────────────────────────────── */
    .input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: white; color: var(--text);
      font-size: .9rem; transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    .input:focus { border-color: var(--growth); box-shadow: 0 0 0 3px rgba(62,120,89,.15); }
    .label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink); margin-bottom: 5px; }

    /* ─── MODAL ─────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(22,35,61,.55);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; transition: opacity var(--transition);
    }
    .modal-backdrop.open { opacity: 1; }
    .modal-box {
      background: var(--card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg); max-width: 520px; width: 90%;
      transform: scale(.94) translateY(10px); transition: transform var(--transition);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-backdrop.open .modal-box { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 26px 0;
    }
    .modal-body { padding: 16px 26px 26px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; background: var(--paper); color: var(--text);
      transition: background var(--transition); flex-shrink: 0;
    }
    .modal-close:hover { background: var(--border); }

    /* ─── COMING SOON ───────────────────────────────────────── */
    .coming-soon-overlay {
      text-align: center; padding: 60px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .coming-soon-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #faefd2, #fde9ac);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(227,169,62,.3);
    }

    /* ─── STAT STRIP ────────────────────────────────────────── */
    .stat-strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px 22px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: .78rem; color: #6b7a74; font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-family: 'Noto Kufi Arabic', sans-serif; font-size: 1.9rem; font-weight: 900; color: var(--ink); line-height: 1; }
    .stat-sub { font-size: .76rem; color: #6b7a74; margin-top: 6px; }

    /* ─── TOAST ─────────────────────────────────────────────── */
    #toast-container {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 2000; display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    .toast {
      background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 99px;
      font-size: .88rem; font-weight: 500; box-shadow: var(--shadow-lg);
      animation: toastIn .3s ease forwards;
      display: flex; align-items: center; gap: 8px;
    }
    @keyframes toastIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .toast.success { background: var(--growth); }
    .toast.warning { background: var(--highlight); color: var(--ink); }
    .toast.error   { background: var(--alert); }

    /* ─── PROGRESS BAR ──────────────────────────────────────── */
    .progress-bar-track {
      height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .progress-bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }

    /* ─── AVATAR ────────────────────────────────────────────── */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 700; font-size: .9rem;
      flex-shrink: 0;
    }

    /* ─── TABLE ─────────────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      background: var(--paper); text-align: right; padding: 11px 16px;
      font-size: .78rem; font-weight: 600; color: #6b7a74; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table td {
      padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: .88rem;
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background var(--transition); }
    .data-table tbody tr:hover { background: rgba(62,120,89,.04); cursor: pointer; }

    /* ─── SECTION HEADER ────────────────────────────────────── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 700; font-size: 1.05rem; color: var(--ink);
    }

    /* ─── RISK INDICATOR ────────────────────────────────────── */
    .risk-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .risk-at-risk { background: var(--alert); }
    .risk-watch   { background: var(--highlight); }
    .risk-normal  { background: var(--growth); }

    /* ─── PAGE TRANSITIONS ──────────────────────────────────── */
    .page { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* ─── SCORE ENTRY FORM ──────────────────────────────────── */
    .question-row {
      display: grid; grid-template-columns: 1fr 1fr 100px 40px;
      gap: 10px; align-items: center; margin-bottom: 10px;
    }
    @media (max-width: 600px) {
      .question-row { grid-template-columns: 1fr 80px 36px; }
      .question-row .skill-col { display: none; }
    }

    /* ─── REMEDIAL QUIZ ─────────────────────────────────────── */
    .quiz-question {
      background: white; border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px;
      margin-bottom: 14px;
    }
    .quiz-option {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); margin-top: 8px;
      cursor: pointer; transition: all var(--transition);
    }
    .quiz-option:hover { border-color: var(--growth); background: rgba(62,120,89,.05); }
    .quiz-option.selected { border-color: var(--growth); background: rgba(62,120,89,.10); }
    .quiz-option input { accent-color: var(--growth); }

    /* ─── CHART CONTAINER ───────────────────────────────────── */
    .chart-wrap { position: relative; }

    /* ─── PRINT ─────────────────────────────────────────────── */
    @media print {
      #nav, #top-bar, .no-print { display: none !important; }
      .card { box-shadow: none !important; border: 1px solid #ccc !important; }
      body { background: white; }
    }

    /* ─── LAYOUT ────────────────────────────────────────────── */
    #app { min-height: 100vh; }

    /* Landing */
    #landing-screen {
      min-height: 100vh; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .landing-logo {
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 900; font-size: 3rem; color: #fff; letter-spacing: -1px;
    }
    .landing-logo span { color: var(--growth); }
    .landing-tagline { color: #a8b8c8; font-size: .95rem; margin-top: 8px; text-align: center; max-width: 420px; }
    .landing-divider { width: 40px; height: 2px; background: var(--growth); margin: 28px auto; }
    .landing-cards {
      display: flex; gap: 20px; margin-top: 10px;
      flex-wrap: wrap; justify-content: center;
    }
    .landing-card {
      width: 240px; padding: 32px 28px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius-lg); cursor: pointer;
      transition: all .3s ease;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      position: relative; overflow: hidden;
    }
    .landing-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
      pointer-events: none;
    }
    .landing-card:hover {
      border-color: var(--growth);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(62,120,89,.25);
    }
    .landing-card-icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(62,120,89,.2);
    }
    .landing-card-title {
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 700; font-size: 1.15rem; color: #fff; text-align: center;
    }
    .landing-card-sub { font-size: .8rem; color: #a8b8c8; text-align: center; }
    .landing-brand { margin-top: 48px; color: #5a7080; font-size: .78rem; }

    /* App shell with sidebar */
    #shell { display: flex; min-height: 100vh; }

    /* Sidebar */
    #nav {
      width: 240px; background: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0;
    }
    .nav-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .nav-logo-text {
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 900; font-size: 1.5rem; color: #fff;
    }
    .nav-logo-text span { color: var(--growth); }
    .nav-logo-sub { font-size: .72rem; color: #5a7a8a; margin-top: 2px; }
    .nav-items { padding: 16px 12px; flex: 1; }
    .nav-group-label {
      font-size: .68rem; font-weight: 600; color: #3a5a6a; text-transform: uppercase;
      letter-spacing: .05em; padding: 0 8px; margin: 16px 0 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      color: #8aa0b0; font-size: .88rem; font-weight: 500;
      cursor: pointer; transition: all var(--transition);
      margin-bottom: 2px; position: relative;
    }
    .nav-item svg { flex-shrink: 0; opacity: .7; }
    .nav-item:hover { background: rgba(255,255,255,.07); color: #c8d8e0; }
    .nav-item:hover svg { opacity: 1; }
    .nav-item.active { background: rgba(62,120,89,.22); color: #fff; }
    .nav-item.active svg { opacity: 1; }
    .nav-item.active::before {
      content: ''; position: absolute; right: 0; top: 25%; bottom: 25%;
      width: 3px; background: var(--growth); border-radius: 99px;
    }
    .nav-bottom {
      padding: 16px 12px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .nav-role-chip {
      background: rgba(62,120,89,.2); color: #7ecaa0;
      border-radius: var(--radius-sm); padding: 8px 12px;
      font-size: .8rem; font-weight: 600; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Main content */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* Top bar */
    #top-bar {
      height: 64px; background: white; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .top-bar-title { font-family: 'Noto Kufi Arabic', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--ink); }
    .top-bar-right { display: flex; align-items: center; gap: 14px; }
    .top-bar-class {
      background: var(--paper); border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 14px; font-size: .82rem; font-weight: 600; color: var(--ink);
    }

    /* Content area */
    #content { flex: 1; padding: 28px; overflow-y: auto; }

    /* Mobile nav toggle */
    #nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; color: var(--ink); }
    #nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 199; }

    @media (max-width: 768px) {
      #nav { position: fixed; right: 0; top: 0; z-index: 200; transform: translateX(100%); transition: transform var(--transition); }
      #nav.open { transform: translateX(0); }
      #nav-overlay { display: block; }
      #nav-overlay.open { display: block; }
      #nav-toggle { display: flex; }
      #main { width: 100%; }
      #content { padding: 16px; }
      #top-bar { padding: 0 16px; }
      .stat-strip { grid-template-columns: 1fr 1fr; }
      .landing-card { width: 100%; max-width: 340px; }
    }

    /* ─── PARENT DASHBOARD ──────────────────────────────────── */
    .parent-hero {
      background: linear-gradient(135deg, var(--growth) 0%, #2d5e42 100%);
      border-radius: var(--radius-lg); padding: 32px;
      color: white; margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .parent-hero::before {
      content: ''; position: absolute; top: -40px; left: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,.06);
    }
    .parent-hero-grade {
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 900; font-size: 3rem; line-height: 1; color: rgba(255,255,255,.95);
    }
    .parent-hero-label { font-size: .82rem; opacity: .75; margin-bottom: 4px; }
    .parent-insight {
      font-size: .94rem; opacity: .85; max-width: 360px; line-height: 1.7;
    }

    /* ─── TREND CHIP ────────────────────────────────────────── */
    .trend-up   { color: var(--growth); font-size: .8rem; font-weight: 600; }
    .trend-down { color: var(--alert);  font-size: .8rem; font-weight: 600; }
    .trend-flat { color: #8a9890;       font-size: .8rem; font-weight: 600; }

    /* ─── TABS ──────────────────────────────────────────────── */
    .tab-bar {
      display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
      overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      padding: 10px 18px; font-size: .88rem; font-weight: 600; color: #6b7a74;
      border-bottom: 3px solid transparent; cursor: pointer; transition: all var(--transition);
      white-space: nowrap; background: none;
      display: flex; align-items: center; gap: 7px;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { color: var(--growth); border-bottom-color: var(--growth); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn .2s ease; }

    /* ─── EARLY WARNING ─────────────────────────────────────── */
    .warning-card {
      border-right: 4px solid var(--alert);
      border-radius: var(--radius-md);
      background: white; padding: 16px 20px;
      margin-bottom: 12px; display: flex; align-items: flex-start; gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .warning-reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .warning-reason-chip {
      background: #f5dbd7; color: #8a3028; border-radius: 99px;
      padding: 3px 10px; font-size: .74rem; font-weight: 600;
    }

    /* ─── STUDENT DETAIL ────────────────────────────────────── */
    .student-header {
      background: var(--ink); border-radius: var(--radius-lg);
      padding: 28px 32px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .student-avatar-lg {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-weight: 900; font-size: 1.4rem; flex-shrink: 0;
    }
    .student-info h2 { color: white; font-size: 1.3rem; margin-bottom: 6px; }
    .student-info-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .student-info-chip {
      background: rgba(255,255,255,.12); color: rgba(255,255,255,.75);
      border-radius: 99px; padding: 3px 12px; font-size: .78rem;
    }
    .student-grade-badge {
      font-family: 'Noto Kufi Arabic', sans-serif; font-weight: 900;
      font-size: 1.6rem; padding: 12px 20px; border-radius: var(--radius-md);
      margin-right: auto; text-align: center;
    }

    /* ─── AI RECOMMENDATION ─────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════════ */
function $(id) { return document.getElementById(id); }
function qs(sel, parent) { return (parent||document).querySelector(sel); }
function qsa(sel, parent) { return [...(parent||document).querySelectorAll(sel)]; }

function avgGrade(grades) {
  const all = Object.values(grades).map(arr => arr[arr.length-1]);
  return Math.round(all.reduce((a,b)=>a+b,0)/all.length);
}

function subjectAvg(subjectId) {
  const vals = STUDENTS.map(s => s.grades[subjectId][5]);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function gradeColor(g) {
  if (g >= 85) return 'var(--growth)';
  if (g >= 70) return 'var(--highlight)';
  return 'var(--alert)';
}

function gradeBadgeClass(g) {
  if (g >= 85) return 'badge-success';
  if (g >= 70) return 'badge-warning';
  return 'badge-alert';
}

function riskBadge(risk) {
  if (risk === 'at-risk') return `<span class="badge badge-alert">⚠ في خطر</span>`;
  if (risk === 'watch')   return `<span class="badge badge-warning">◉ يحتاج متابعة</span>`;
  return `<span class="badge badge-success">✓ طبيعي</span>`;
}

function avatarColors(name) {
  const colors = [
    ['#d6ede3','#2a5c42'],['#dde8f5','#1a3a6a'],['#faefd2','#7a5012'],
    ['#f5dbd7','#8a3028'],['#e8eaf6','#3949ab'],['#f3e5f5','#7b1fa2'],
  ];
  const i = name.charCodeAt(0) % colors.length;
  return colors[i];
}

function initials(name) {
  const parts = name.trim().split(' ');
  return parts.length >= 2 ? parts[0][0]+parts[1][0] : parts[0].substring(0,2);
}

function destroyChart(key) {
  if (STATE.charts[key]) {
    try { STATE.charts[key].destroy(); } catch(e) {}
    delete STATE.charts[key];
  }
}

function createSafeChart(ctx, config) {
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js is not loaded.');
    return null;
  }
  try {
    return new Chart(ctx, config);
  } catch(e) {
    console.error('Error creating chart:', e);
    return null;
  }
}

function showToast(msg, type='', duration=3000) {
  const c = $('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, duration);
}

function openModal(id) {
  const m = $(id);
  if (!m) return;
  m.classList.remove('hidden');
  requestAnimationFrame(()=>m.classList.add('open'));
}

function closeModal(id) {
  const m = $(id);
  if (!m) return;
  m.classList.remove('open');
  setTimeout(()=>m.classList.add('hidden'), 220);
}

function enterRole(role) {
  setState({ role });
  $('landing-screen').classList.add('hidden');
  $('shell').classList.remove('hidden');
  buildNav(role);
  navigateTo(role === 'teacher' ? 'teacher-overview' : 'parent-dashboard');
}

function exitToLanding() {
  setState({ role: null, page: 'landing' });
  $('shell').classList.add('hidden');
  $('landing-screen').classList.remove('hidden');
  // destroy all charts
  Object.keys(STATE.charts).forEach(k=>{ try{STATE.charts[k].destroy();}catch(e){} });
  STATE.charts = {};
}

function navigateTo(page, extra={}) {
  setState({ page, ...extra });
  renderPage(page);
  setNavActive(page);
  $('top-bar-title').textContent = PAGE_TITLES[page] || '';
  // close mobile nav
  $('nav').classList.remove('open');
  $('nav-overlay').classList.remove('open');
  window.scrollTo(0,0);
}

async function generateQuizWithAI(skill, studentName) {
  const prompt = `أنت مساعد تعليمي متخصص. أنشئ اختباراً علاجياً باللغة العربية يحتوي على 5 أسئلة متعددة الخيارات تستهدف المهارة التالية: "${skill}".

متطلبات:
- كل سؤال له 4 خيارات (أ، ب، ج، د)
- حدد رقم الإجابة الصحيحة (0 للخيار الأول، 1 للثاني... إلخ)
- أضف تلميحاً قصيراً لكل سؤال
- الأسئلة يجب أن تكون واضحة ومناسبة للصف السادس الابتدائي
- أعد الرد بتنسيق JSON فقط كالتالي:
[{"q":"نص السؤال","opts":["أ","ب","ج","د"],"ans":0,"hint":"التلميح"}]`;

  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${OPENAI_KEY}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.7,
      max_tokens: 1500,
    })
  });

  if (!resp.ok) throw new Error(`OpenAI API error: ${resp.status}`);
  const data = await resp.json();
  const raw = data.choices?.[0]?.message?.content || '';

  // Extract JSON from response (may have markdown code fences)
  const jsonMatch = raw.match(/\[[\s\S]*\]/);
  if (!jsonMatch) throw new Error('No JSON array in OpenAI response');
  return JSON.parse(jsonMatch[0]);
}

          <div class="label">وصف السؤال</div>
          <div class="label skill-col">المهارة المرتبطة</div>
          <div class="label">الدرجة / 10</div>
          <div></div>
        </div>
        <div id="score-rows-container"></div>
        <div id="se-success" class="hidden" style="background:linear-gradient(135deg,#d6ede3,#eaf7f0);border:1px solid #b0d8c0;border-radius:var(--radius-md);padding:16px 20px;margin-top:16px;display:flex;align-items:center;gap:12px">
          <svg width="22" height="22" fill="none" stroke="var(--growth)" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span style="color:var(--growth);font-weight:600">تم حفظ الدرجات بنجاح</span>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px">
          <button class="btn btn-secondary" onclick="resetScoreForm()">إعادة تعيين</button>
          <button class="btn btn-primary" id="se-submit-btn" onclick="submitScores()">حفظ الدرجات</button>
        </div>
      </div>
    </div>
  `;
  renderScoreRows();
}

function renderScoreRows() {
  const container = $('score-rows-container');
  if (!container) return;
  if (!STATE.scoreRows.length) STATE.scoreRows = [{ question:'', skill:'', score:'' }];
  container.innerHTML = STATE.scoreRows.map((row, i) => `
    <div class="question-row" id="row-${i}">
      <input class="input" placeholder="السؤال ${i+1}" value="${row.question}" oninput="updateScoreRow(${i},'question',this.value)" />
      <input class="input skill-col" placeholder="المهارة (اختياري)" value="${row.skill}" oninput="updateScoreRow(${i},'skill',this.value)" />
      <input class="input" type="number" min="0" max="10" placeholder="0–10" value="${row.score}" oninput="updateScoreRow(${i},'score',this.value)" />
      <button class="btn btn-ghost btn-sm" style="color:var(--alert);padding:6px" onclick="removeScoreRow(${i})" ${STATE.scoreRows.length<=1?'disabled':''}>✕</button>
    </div>
  `).join('');
}

function addScoreRow() {
  STATE.scoreRows.push({ question:'', skill:'', score:'' });
  renderScoreRows();
}

function removeScoreRow(i) {
  STATE.scoreRows.splice(i,1);
  if (!STATE.scoreRows.length) STATE.scoreRows=[{question:'',skill:'',score:''}];
  renderScoreRows();
}

function updateScoreRow(i, field, val) {
  STATE.scoreRows[i][field] = val;
}

function resetScoreForm() {
  STATE.scoreRows = [{question:'',skill:'',score:''}];
  renderScoreRows();
  const s = $('se-success'); if(s) s.classList.add('hidden');
}

function submitScores() {
  const btn = $('se-submit-btn');
  const suc = $('se-success');
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';
  setTimeout(()=>{
    btn.disabled = false;
    btn.textContent = 'حفظ الدرجات';
    if (suc) suc.classList.remove('hidden');
    showToast('✓ تم حفظ درجات الاختبار بنجاح', 'success');
  }, 1200);
}

              ${change>0?`<span class="trend-up">▲ +${change}%</span>`:change<0?`<span class="trend-down">▼ ${Math.abs(change)}%</span>`:`<span class="trend-flat">◆ مستقر</span>`}
              <span style="font-weight:700;color:${gradeColor(latest)}">${latest}%</span>
            </div>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width:${latest}%;background:${sub.color}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            ${grades.map((g,i)=>`<div style="width:8px;height:8px;border-radius:50%;background:${sub.color};opacity:${0.3+0.7*(i/5)}" title="${WEEKS[i]}: ${g}%"></div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Progress chart -->
    <div class="card" style="padding:22px">
      <div class="section-title" style="margin-bottom:16px">تطور المتوسط العام</div>
      <div class="chart-wrap" style="height:180px"><canvas id="chart-parent-trend"></canvas></div>
    </div>
  `;

  requestAnimationFrame(()=>{
    const ctx = $('chart-parent-trend');
    if (!ctx) return;
    const weekAvgs = WEEKS.map((_,wi)=>Math.round(SUBJECTS.map(sub=>s.grades[sub.id][wi]).reduce((a,b)=>a+b,0)/4));
    destroyChart('parent-trend');
    STATE.charts['parent-trend'] = createSafeChart(ctx.getContext('2d'),{
      type:'line',
      data:{
        labels:WEEKS,
        datasets:[{
          label:'المتوسط العام',
          data:weekAvgs,
          borderColor:'var(--growth)',
          backgroundColor:'rgba(62,120,89,.15)',
          borderWidth:2.5, pointRadius:5, pointBackgroundColor:'var(--growth)', tension:.3, fill:true
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          y:{ min:70,max:100, grid:{color:'rgba(0,0,0,.04)'}, ticks:{font:{family:'IBM Plex Sans Arabic'}} },
          x:{ grid:{display:false}, ticks:{font:{family:'IBM Plex Sans Arabic'}} }
        }
      }
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   COMING SOON
══════════════════════════════════════════════════════════════ */
function renderComingSoon(title, desc, iconName, el) {
  if (!el) {
    const content = $('content');
    el = content.querySelector('.page') || content;
  }
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
      <div style="text-align:center;max-width:440px;padding:20px">
        <span class="badge badge-coming" style="font-size:.82rem;padding:5px 16px;margin-bottom:24px;display:inline-block">قريباً</span>
        <div class="coming-soon-icon" style="margin:0 auto 20px">
          ${iconSvg(iconName)||'<div style="width:30px;height:30px;background:var(--highlight);border-radius:50%"></div>'}
        </div>
        <h2 style="font-size:1.4rem;margin-bottom:12px">${title}</h2>
        <p style="color:#6b7a74;font-size:.92rem;line-height:1.8;margin-bottom:28px">${desc}</p>
        <div style="background:linear-gradient(135deg,#faefd2,#fde9ac);border-radius:var(--radius-md);padding:16px 20px;border:1px solid #f0cc76">
          <div style="font-size:.82rem;color:#7a5012;line-height:1.7">هذه الميزة جزء من خارطة طريق <strong>بصيرة</strong> الكاملة. يُمكن النقاش حول إدراجها في برنامج التجربة الأولى.</div>
        </div>
      </div>
    </div>
  `;
}

/* ══════════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════════ */
window.enterRole = enterRole;
window.exitToLanding = exitToLanding;
window.navigateTo = navigateTo;
window.toggleNav = toggleNav;

function initApp() {
  const landing = $('landing-screen');
  const shell = $('shell');
  if (landing) landing.classList.remove('hidden');
  if (shell) shell.classList.add('hidden');

  const btnTeacher = $('btn-enter-teacher');
  if (btnTeacher) {
    btnTeacher.onclick = function(e) { e.preventDefault(); enterRole('teacher'); };
  }
  const btnParent = $('btn-enter-parent');
  if (btnParent) {
    btnParent.onclick = function(e) { e.preventDefault(); enterRole('parent'); };
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
